# render.yaml - LeadStrategus CRM on Render's free tier.
# Render → New → Blueprint → this repo. Creates two services:
#   leadstrategus-crm-api  FastAPI (free web service; sleeps after ~15 min idle)
#   leadstrategus-crm      React + TypeScript build (free static site; never sleeps)
# The database is Neon (free plan), not Render: paste its connection string
# into CRM_DATABASE_URL. Values marked sync:false are asked for on first deploy.
services:
  - type: web
    name: leadstrategus-crm-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: CRM_DATABASE_URL
        sync: false   # Neon → Connect → Direct connection string (not the -pooler one)
      - key: CRM_FRONTEND_ORIGIN
        sync: false   # the static site's URL, e.g. https://leadstrategus-crm.onrender.com
      - key: CRM_GOOGLE_CLIENT_ID
        sync: false   # OAuth client of the Internal Google Cloud app
      - key: CRM_ALLOWED_DOMAIN
        value: leadstrategus.com
      - key: CRM_ADMIN_EMAILS
        sync: false   # comma-separated; become admins on first sign-in
      - key: CRM_DEV_AUTH
        value: "false"
      - key: CRM_GOOGLE_CLIENT_SECRET
        sync: false   # secret of the same Web OAuth client (Calendar sync)
      - key: CRM_PUBLIC_API_URL
        sync: false   # this API's URL, e.g. https://leadstrategus-crm-api.onrender.com
      - key: CRM_TOKEN_KEY
        generateValue: true   # encrypts stored Google refresh tokens; keep it stable
      - key: CRM_HUBSPOT_TOKEN
        sync: false   # HubSpot private app (read-only scopes); only needed for the import
      - key: CRM_SMTP_HOST
        sync: false   # daily digest email, e.g. smtp.gmail.com
      - key: CRM_SMTP_PORT
        value: "587"
      - key: CRM_SMTP_USER
        sync: false   # sending mailbox, e.g. crm@leadstrategus.com
      - key: CRM_SMTP_PASSWORD
        sync: false   # an app password for that mailbox
      - key: CRM_CRON_SECRET
        generateValue: true   # copy into the GitHub secret CRM_CRON_SECRET (daily-digest workflow)

  - type: web
    name: leadstrategus-crm
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        sync: false   # the API's URL, e.g. https://leadstrategus-crm-api.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false   # same Client ID as CRM_GOOGLE_CLIENT_ID
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      # Installable app: the service worker must always be re-checked so new deploys arrive.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
    routes:
      # Client-side routes (/pipeline, /opportunities/…) all load index.html.
      - type: rewrite
        source: /*
        destination: /index.html
